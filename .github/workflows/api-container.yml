name: API Container

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  merge_group:

permissions:
  contents: read

jobs:
  build-and-scan:
    name: api-container-build-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --file apps/api/Dockerfile --tag referral-api:ci .
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: referral-api:ci
          format: table
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          exit-code: '1'
